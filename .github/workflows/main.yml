name: main
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [pypi_release]

jobs:
  build:
    name: main
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push back to the repo
    steps:
      - if: ${{ startsWith(github.event_name, 'repository_dispatch') }}
        run: sleep 30

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: needed for git operations below
          persist-credentials: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: set git config
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - run: uv run --script mirror.py

      - name: check for unpushed commits
        id: check_unpushed
        run: |
          UNPUSHED_COMMITS=$(git log origin/main..HEAD)
          if [ -z "$UNPUSHED_COMMITS" ]; then
            echo "No unpushed commits found."
            echo "changes_exist=false" >> $GITHUB_ENV
          else
            echo "Unpushed commits found."
            echo "changes_exist=true" >> $GITHUB_ENV
          fi

      - name: push changes if they exist
        if: env.changes_exist == 'true'
        run: |
          git push origin HEAD:refs/heads/main
          git push origin HEAD:refs/heads/main --tags

      - name: create release on new tag if new changes exist
        if: env.changes_exist == 'true'
        run: |
          TAG_NAME=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          RELEASE_NOTES_FILE=release-notes.md

          RELEASE_NOTES=$(gh release view "$TAG_NAME" \
            --repo zizmorcore/zizmor \
            --json body \
            --jq '.body // ""')

          if [[ -z "$RELEASE_NOTES" ]]; then
            RELEASE_NOTES="See: https://github.com/zizmorcore/zizmor/releases/tag/${TAG_NAME}"
          fi

          printf '%s\n' "$RELEASE_NOTES" > "$RELEASE_NOTES_FILE"

          echo "$TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
